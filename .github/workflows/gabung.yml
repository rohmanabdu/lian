name: Gabung duapl
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'  # auto gabung tiap 2 jam

concurrency:
  group: gabung-playlist
  cancel-in-progress: false

jobs:
  gabung:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - run: python gabung.py

      - name: Push Hasil Gabungan
        run: |
          git config user.name "deqiatv-bot"
          git config user.email "deqiatv-bot@users.noreply.github.com"
          git add hasill
          git diff --staged --quiet && echo "Gak ada perubahan" && exit 0
          git commit -m "auto gabung hasill + ramaa2"
          git pull --rebase --autostash origin main
          git push
