name: Update Playlist Otomatis
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Update rama1.m3u
        run: python scripts/update1.py
        
      - name: Update rama2.m3u (playlist event batur)
        run: python scripts/update2.py
        
      - name: Update rama3.m3u (playlist event batur)
        run: python scripts/update3.py
        
      - name: Commit & Push
        run: |
          git config --global user.name "auto-bot"
          git config --global user.email "bot@github.com"
          git add playlist/
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan"
            exit 0
          fi
          git commit -m "Auto update playlist - $(date -u)"
          git pull --rebase origin main
          git push
